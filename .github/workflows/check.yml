name: Check

on:
  pull_request:
  push:
    branches: [main]
  # The sync job starts it on the branches it opens pull requests from.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Validating needs no sign-in. Pinned, so a new release can't change the result of a run.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.332
      - name: The catalog and every plugin pass Claude Code's checks, including the plugin directory's
        run: |
          claude plugin validate .
          for folder in plugins/*/; do claude plugin validate "$folder" --profile directory --strict; done
      - name: Both catalogs agree, and every file a manifest names exists
        run: node scripts/check.mjs
